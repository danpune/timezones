<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Time Zones</title>
<meta name="description" content="Compare Austin, San Francisco, New York, Mumbai, London or any time zone. Slide across the day, see who is at work.">
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Zones">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4ed8'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='white' stroke-width='2.5'/%3E%3Cpath d='M16 9v7l5 3' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231d4ed8'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='white' stroke-width='2.5'/%3E%3Cpath d='M16 9v7l5 3' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f3f4f6;--panel:#fff;--line:#e5e7eb;--tx:#111827;--mut:#6b7280;--acc:#1d4ed8;
  --work:#bbf7d0;--work-tx:#14532d;--edge:#fde68a;--edge-tx:#713f12;--night:#e5e7eb;--night-tx:#6b7280;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0f1115;--panel:#1a1d24;--line:#2a2f3a;--tx:#f3f4f6;--mut:#9ca3af;--acc:#60a5fa;
  --work:#14532d;--work-tx:#bbf7d0;--edge:#713f12;--edge-tx:#fde68a;--night:#262a33;--night-tx:#9ca3af;
}}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{max-width:720px;margin:0 auto;padding:12px}
h1{font-size:20px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
h1 small{font-size:12px;font-weight:400;color:var(--mut)}
.bar{position:sticky;top:0;z-index:2;background:var(--bg);padding:6px 0 10px}
.ctl{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.ctl input[type=date]{flex:1;min-height:44px;font:inherit;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--tx)}
button{min-height:44px;padding:0 14px;font:inherit;font-weight:600;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--acc);cursor:pointer}
button.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
#now{min-width:112px;display:flex;align-items:center;justify-content:center;gap:6px}
#now .dot{width:8px;height:8px;border-radius:50%;background:#16a34a;flex:none;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){#now .dot{animation:none}}
.slider{display:flex;align-items:center;gap:10px}
.slider input{flex:1;height:44px;accent-color:var(--acc)}
.slider .t{min-width:88px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:18px}
.city{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.city.base{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.top{display:flex;align-items:center;gap:8px}
.name{flex:1;min-width:0}
.name b{font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name span{font-size:12px;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{text-align:right;font-variant-numeric:tabular-nums}
.time b{font-size:22px;display:block;line-height:1.1}
.time span{font-size:12px;color:var(--mut)}
.time .d{color:var(--acc);font-weight:600}
.ic{min-width:40px;min-height:40px;padding:0;font-size:18px;border:0;background:none;color:var(--mut)}
.ic.on{color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(24,1fr);gap:1px;margin-top:8px;border-radius:6px;overflow:hidden}
.grid div{font-size:10px;text-align:center;padding:5px 0;background:var(--night);color:var(--night-tx);cursor:pointer;line-height:1;min-height:22px}
.grid .w{background:var(--work);color:var(--work-tx)}
.grid .e{background:var(--edge);color:var(--edge-tx)}
.grid .cur{outline:2px solid var(--acc);outline-offset:-2px;font-weight:700}
.add{display:flex;gap:8px;margin:12px 0}
.add input{flex:1;min-height:44px;font:inherit;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--tx)}
.legend{font-size:12px;color:var(--mut);display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
</style>
</head>
<body>
<main>
<h1>Time Zones <small id="tzLocal"></small></h1>
<div class="bar">
  <div class="ctl">
    <input type="date" id="date" aria-label="Date">
    <button id="now"><span class="dot"></span>Live</button>
  </div>
  <div class="slider">
    <input type="range" id="slider" min="0" max="1425" step="15" aria-label="Time of day in base city">
    <div class="t" id="sliderT"></div>
  </div>
  <div class="hint">Times are live and update every minute. Slide or tap an hour to plan ahead. ★ sets the base city.</div>
</div>
<div id="list"></div>
<form class="add" id="addForm">
  <input id="addInput" list="tzList" placeholder="Add city or zone (e.g. Tokyo, Berlin, Asia/Dubai)" autocomplete="off">
  <datalist id="tzList"></datalist>
  <button type="submit">Add</button>
</form>
<div class="legend"><span><i style="background:var(--work)"></i>Work 9–18</span><span><i style="background:var(--edge)"></i>7–9 &amp; 18–22</span><span><i style="background:var(--night)"></i>Night</span></div>
</main>
<script>
// Friendly names → IANA zones. Anything else is resolved against Intl.supportedValuesOf.
const ALIAS={
  'austin':'America/Chicago','austin tx':'America/Chicago','dallas':'America/Chicago','houston':'America/Chicago','chicago':'America/Chicago',
  'sfo':'America/Los_Angeles','san francisco':'America/Los_Angeles','sf':'America/Los_Angeles','la':'America/Los_Angeles','los angeles':'America/Los_Angeles','seattle':'America/Los_Angeles',
  'nyc':'America/New_York','new york':'America/New_York','boston':'America/New_York','miami':'America/New_York','toronto':'America/Toronto',
  'denver':'America/Denver','phoenix':'America/Phoenix',
  'mumbai':'Asia/Kolkata','pune':'Asia/Kolkata','bangalore':'Asia/Kolkata','bengaluru':'Asia/Kolkata','delhi':'Asia/Kolkata','india':'Asia/Kolkata','hyderabad':'Asia/Kolkata','chennai':'Asia/Kolkata',
  'london':'Europe/London','uk':'Europe/London','dublin':'Europe/Dublin','paris':'Europe/Paris','berlin':'Europe/Berlin','amsterdam':'Europe/Amsterdam','madrid':'Europe/Madrid','rome':'Europe/Rome',
  'dubai':'Asia/Dubai','singapore':'Asia/Singapore','hong kong':'Asia/Hong_Kong','tokyo':'Asia/Tokyo','sydney':'Australia/Sydney','melbourne':'Australia/Melbourne','auckland':'Pacific/Auckland','sao paulo':'America/Sao_Paulo','mexico city':'America/Mexico_City','utc':'UTC'
};
const LABEL={'America/Chicago':'Austin','America/Los_Angeles':'San Francisco','America/New_York':'New York','Asia/Kolkata':'Mumbai','Europe/London':'London'};
const DEFAULT=['America/Chicago','America/Los_Angeles','America/New_York','Asia/Kolkata','Europe/London'];
const ALL=(Intl.supportedValuesOf?Intl.supportedValuesOf('timeZone'):Object.values(ALIAS));

let state=load();
function load(){try{const s=JSON.parse(localStorage.getItem('tz1'));if(s&&s.zones&&s.zones.length)return s}catch(e){}return{zones:DEFAULT.slice(),base:DEFAULT[0]}}
function save(){try{localStorage.setItem('tz1',JSON.stringify(state))}catch(e){}}

// --- time math (all native Intl) ---
const partsCache={};
function fmt(zone){return partsCache[zone]||(partsCache[zone]=new Intl.DateTimeFormat('en-US',{timeZone:zone,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'}))}
// wall-clock time in `zone` at instant t, expressed as a UTC ms number
function wall(t,zone){const p={};for(const x of fmt(zone).formatToParts(t))p[x.type]=x.value;return Date.UTC(+p.year,p.month-1,+p.day,+p.hour,+p.minute,+p.second)}
// instant when wall clock in `zone` reads date d (yyyy-mm-dd) at `min` minutes; two passes handle DST edges
function instantAt(d,min,zone){const [y,m,dd]=d.split('-').map(Number);const want=Date.UTC(y,m-1,dd,0,min);let t=want;for(let i=0;i<2;i++)t=want-(wall(t,zone)-t);return t}
function ymd(t,zone){const w=new Date(wall(t,zone));return w.toISOString().slice(0,10)}
function hourIn(t,zone){return new Date(wall(t,zone)).getUTCHours()}
function cls(h){return h>=9&&h<18?'w':(h>=7&&h<9)||(h>=18&&h<22)?'e':''}
function label(zone){return LABEL[zone]||zone.split('/').pop().replace(/_/g,' ')}
function offset(t,zone){return new Intl.DateTimeFormat('en-US',{timeZone:zone,timeZoneName:'shortOffset'}).formatToParts(t).find(p=>p.type==='timeZoneName').value.replace('GMT','UTC')}

// --- UI ---
const $=id=>document.getElementById(id);
const dateEl=$('date'),slider=$('slider'),sliderT=$('sliderT'),list=$('list');
$('tzLocal').textContent='You: '+Intl.DateTimeFormat().resolvedOptions().timeZone;
for(const z of ALL){const o=document.createElement('option');o.value=z;$('tzList').appendChild(o)}
for(const a of Object.keys(ALIAS)){const o=document.createElement('option');o.value=a.replace(/\b\w/g,c=>c.toUpperCase());$('tzList').appendChild(o)}

// live = the page tracks the real clock. The slider only steps in 15s, so while live we
// read Date.now() directly and let the slider follow along as a rough position indicator.
let live=true;
function syncControls(t){dateEl.value=ymd(t,state.base);const w=new Date(wall(t,state.base));slider.value=Math.round((w.getUTCHours()*60+w.getUTCMinutes())/15)*15}
function setNow(){live=true;render()}
function render(){
  const t=live?Date.now():instantAt(dateEl.value,+slider.value,state.base);
  if(live)syncControls(t);
  now.className=live?'':'primary';
  now.innerHTML=live?'<span class="dot"></span>Live':'Back to now';
  const baseDay=ymd(t,state.base);
  sliderT.textContent=new Intl.DateTimeFormat('en-US',{timeZone:state.base,hour:'numeric',minute:'2-digit'}).format(t);
  const hours=[];for(let h=0;h<24;h++)hours.push(instantAt(dateEl.value,h*60,state.base));
  const curH=hourIn(t,state.base);
  list.innerHTML='';
  for(const z of state.zones){
    const day=ymd(t,z);const dd=Math.round((Date.parse(day)-Date.parse(baseDay))/864e5);
    const el=document.createElement('div');el.className='city'+(z===state.base?' base':'');
    el.innerHTML=`<div class="top">
      <button class="ic${z===state.base?' on':''}" data-base="${z}" aria-label="Set as base">${z===state.base?'★':'☆'}</button>
      <div class="name"><b>${label(z)}</b><span>${z} · ${offset(t,z)}</span></div>
      <div class="time"><b>${new Intl.DateTimeFormat('en-US',{timeZone:z,hour:'numeric',minute:'2-digit'}).format(t)}</b>
        <span>${new Intl.DateTimeFormat('en-US',{timeZone:z,weekday:'short',month:'short',day:'numeric'}).format(t)}${dd?` <em class="d">${dd>0?'+':''}${dd}d</em>`:''}</span></div>
      <button class="ic" data-del="${z}" aria-label="Remove">×</button></div>
      <div class="grid">${hours.map((ht,i)=>{const h=hourIn(ht,z);return `<div class="${cls(h)}${i===curH?' cur':''}" data-h="${i}">${h===0?'12a':h<12?h:h===12?'12p':h-12}</div>`}).join('')}</div>`;
    list.appendChild(el);
  }
}
list.addEventListener('click',e=>{
  const b=e.target.closest('[data-base]'),d=e.target.closest('[data-del]'),h=e.target.closest('[data-h]');
  if(b){ // keep the same instant, re-express it in the new base
    const t=live?Date.now():instantAt(dateEl.value,+slider.value,state.base);state.base=b.dataset.base;
    syncControls(t);save();render()}
  else if(d){if(state.zones.length>1){state.zones=state.zones.filter(z=>z!==d.dataset.del);if(state.base===d.dataset.del)state.base=state.zones[0];save();render()}}
  else if(h){live=false;slider.value=h.dataset.h*60;render()}
});
$('addForm').addEventListener('submit',e=>{
  e.preventDefault();const q=$('addInput').value.trim();if(!q)return;
  const z=ALIAS[q.toLowerCase()]||ALL.find(x=>x.toLowerCase()===q.toLowerCase())||ALL.find(x=>x.toLowerCase().includes(q.toLowerCase().replace(/ /g,'_')));
  if(!z){alert('Unknown time zone: '+q);return}
  if(!state.zones.includes(z))state.zones.push(z);$('addInput').value='';save();render();
});
const now=$('now');
now.addEventListener('click',setNow);
slider.addEventListener('input',()=>{live=false;render()});
dateEl.addEventListener('change',()=>{live=false;render()});

// tick the clock: check often, repaint only when the displayed minute actually rolls over
let lastMin=-1;
setInterval(()=>{const m=new Date().getMinutes();if(live&&m!==lastMin){lastMin=m;render()}},5000);
// iOS freezes timers in a backgrounded tab, so catch up the moment it comes back
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&live)render()});

setNow();
</script>
</body>
</html>
